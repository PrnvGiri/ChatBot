<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo-placeholder">
                <i class="fas fa-robot"></i>
            </div>
            <div class="header-info">
                <h2>AI Assistant</h2>
                <p>Powered by LLaMA & Groq</p>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your AI assistant. How can I help you today?
                </div>
            </div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-btn" title="Send Message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    
    <div class="setup-notice" id="setup-notice">
        <h3><i class="fas fa-exclamation-triangle"></i> API Key Required</h3>
        <p>Please add your Groq API key in the <code>script.js</code> file to start using the chatbot.</p>
        <button id="close-notice">Got it</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
